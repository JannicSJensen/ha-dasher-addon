configuration:
  log_level:
    name: Logniveau
    description: "Hvor meget appen skriver i sin log."
  read_only:
    name: Skrivebeskyttet
    description: "Vis tilstande på tabletterne, men afvis alle kommandoer fra dem."
  entity_map:
    name: Entitetstilknytning
    description: "Brug entiteter fra din Home Assistant i stedet for dem, dashboard.yaml nævner, uden at redigere filen. Hver række har entitets-id'et som skrevet i dashboard.yaml (Fra) og den entitet der skal bruges i stedet (Til); begge skal være af samme slags (et lys til et lys, en sensor til en sensor). Dashboard-entiteter som Home Assistant ikke kender vises nederst på tabletsiden og står i appens log med forslag. Genstart appen efter ændring."
    fields:
      from:
        name: Dashboard-entitet
        description: "Entitets-id som skrevet i dashboard.yaml, fx sensor.car_range."
      to:
        name: Home Assistant-entitet
        description: "Entiteten i din Home Assistant der skal bruges i stedet, fx sensor.fordpass_elveh."
  allow_todo_management:
    name: Tillad ændring af huskelister
    description: "Lader folk ved en tablet oprette, omdøbe og slette huskelister fra Local To-do-integrationen (at redigere en listes punkter kan altid lade sig gøre). Slå fra for at forbyde det."
  allow_area_editing:
    name: Tillad redigering af oversigtssiderne
    description: "Lader folk ved en tablet fjerne enheder fra områdesiderne og kort fra Enheder-siden og få dem tilbage (gemmes i appen og deles af alle tablets). Slå fra for at forbyde det."
  allow_meal_editing:
    name: Tillad redigering af madplanen
    description: "Lader folk ved en tablet ændre madplanen og familiens regler og bede AI (Home Assistant AI Task) om at planlægge, bytte retter og skrive opskrifter. Hver AI-forespørgsel bruger din AI-udbyder. Slå fra for at forbyde det."
  music_assistant_url:
    name: Music Assistant-adresse
    description: "Adressen på din Music Assistant-server, fx http://192.168.1.10:8095. Lad feltet stå tomt, når Music Assistant kører som Home Assistant-app: Dasher finder den så selv. Ellers kræves den til fanerne Udforsk, Album, Kunstnere, Podcasts og Søg."
  music_assistant_token:
    name: Music Assistant-adgangstoken
    description: "Et langtidstoken oprettet i Music Assistant under Indstillinger, Profil. Det bruges kun til at læse biblioteket."
  plex_url:
    name: Plex-adresse
    description: "Adressen på din Plex-server, som afspillerne på dit netværk når den, fx http://192.168.1.10:32400. Kun nødvendig for at afspille Plex på Apple TV og DLNA-afspillere med et streamlink; Cast-enheder og Plex-klienter virker uden."
  plex_token:
    name: Plex-token
    description: "X-Plex-Token for din Plex-konto (åbn et emne i Plex Web, Hent info, Vis XML, og kopiér X-Plex-Token fra adressen). Det bruges til at læse filoplysninger og er en del af det streamlink, Home Assistant sender til afspilleren."
