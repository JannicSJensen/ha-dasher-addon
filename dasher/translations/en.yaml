configuration:
  log_level:
    name: Log level
    description: "How much the app writes to its log."
  read_only:
    name: Read-only
    description: "Show states on the tablets but refuse every command from them."
  allow_entity_mapping:
    name: Allow mapping of missing entities
    description: "Lets the dashboard on a tablet map entities of dashboard.yaml that your Home Assistant does not have to entities it does have (saved in entity-map.yaml). Turn off to forbid changes from the tablets."
  music_assistant_url:
    name: Music Assistant address
    description: "Address of your Music Assistant server, for example http://192.168.1.10:8095. Leave empty when Music Assistant runs as a Home Assistant app: Dasher then finds it itself. Needed for the Discover, Albums, Artists, Podcasts and Search tabs otherwise."
  music_assistant_token:
    name: Music Assistant access token
    description: "A long-lived token created in Music Assistant under Settings, Profile. It is only used to read the library."
  plex_url:
    name: Plex address
    description: "Address of your Plex server as the players on your network reach it, for example http://192.168.1.10:32400. Only needed to play Plex on Apple TVs and DLNA players with a stream link; Cast devices and Plex clients work without it."
  plex_token:
    name: Plex token
    description: "The X-Plex-Token of your Plex account (open an item in Plex Web, Get Info, View XML, and copy X-Plex-Token from the address). It is used to read file information and is part of the stream link that Home Assistant sends to the player."
