configuration:
  log_level:
    name: Log level
    description: "How much the app writes to its log."
  read_only:
    name: Read-only
    description: "Show states on the tablets but refuse every command from them."
  entity_map:
    name: Entity mapping
    description: "Use entities of your Home Assistant in place of the ones dashboard.yaml names, without editing the file. Each row has the entity id as written in dashboard.yaml (From) and the entity to use instead (To); both must be of the same kind (a light for a light, a sensor for a sensor). Dashboard entities that Home Assistant does not know are shown at the bottom of the tablet page and listed in the app log with suggestions. Restart the app after changing."
    fields:
      from:
        name: Dashboard entity
        description: "The entity id as written in dashboard.yaml, for example sensor.car_range."
      to:
        name: Home Assistant entity
        description: "The entity of your Home Assistant to use instead, for example sensor.fordpass_elveh."
  allow_todo_management:
    name: Allow changing to-do lists
    description: "Lets people at a tablet create, rename and delete to-do lists of the Local To-do integration (editing the items of a list is always possible). Turn off to forbid it."
  allow_area_editing:
    name: Allow editing the overview pages
    description: "Lets people at a tablet remove devices from the area pages and cards from the Devices page, and bring them back (kept in the app, shared by all tablets). Turn off to forbid it."
  allow_area_picture_upload:
    name: Put room pictures on the areas
    description: "Lets the app give areas that have no picture a built-in room picture in Home Assistant itself (Settings, Areas), once per area. Pictures you choose yourself are never changed. Turn off to keep the pictures out of Home Assistant's area settings."
  allow_meal_editing:
    name: Allow editing the meal plan
    description: "Lets people at a tablet change the meal plan and the family rules, and ask the AI (Home Assistant AI Task) to plan, swap dishes and write recipes. Each AI request uses your AI provider. Turn off to forbid it."
  music_assistant_url:
    name: Music Assistant address
    description: "Address of your Music Assistant server, for example http://192.168.1.10:8095. Leave empty when Music Assistant runs as a Home Assistant app: Dasher then finds it itself. Needed for the Discover, Albums, Artists, Podcasts and Search tabs otherwise."
  music_assistant_token:
    name: Music Assistant access token
    description: "A long-lived token created in Music Assistant under Settings, Profile. It is only used to read the library."
  plex_url:
    name: Plex address
    description: "Address of your Plex server as the players on your network reach it, for example http://192.168.1.10:32400. Only needed to play Plex on Apple TVs and DLNA players with a stream link; Cast devices and Plex clients work without it."
  plex_token:
    name: Plex token
    description: "The X-Plex-Token of your Plex account (open an item in Plex Web, Get Info, View XML, and copy X-Plex-Token from the address). It is used to read file information and is part of the stream link that Home Assistant sends to the player."
