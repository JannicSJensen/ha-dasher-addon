# Dasher dashboard configuration.
# Edit this file and save: connected tablets reload automatically.
#
# Images: put files in the "assets" folder next to this file and refer to them
# by name (e.g. image: living-room.jpg). Full https:// URLs work too.
# Icons: any Material Design Icon, see https://pictogrammers.com/library/mdi/
# Replace every entity id below with your own entities.

title: Home
language: en          # en | da  (UI texts)
# locale: en-GB       # number/date formatting, defaults to the language
accent: "#2dd4bf"
idle_return: 120      # seconds of inactivity before returning to the first page (0 = off)

# Every page is a grid. A tile is placed with col/row (1-based) and spans w x h cells.
columns: 4
rows: 2
gap: 8

# Area pages: adds a menu entry that lists every area in Home Assistant as a picture.
# Tapping one opens the area with its lights, players, temperature, humidity and windows.
# Pictures: put <area_id>.jpg (or the area name, e.g. living-room.jpg) in assets/areas/.
areas:
  # enabled: false          # remove the menu entry completely
  # title: Areas
  # hide: [home]            # area ids or names to leave out
  # domains: [light, fan, cover, media_player]   # also: switch, input_boolean
  # overrides:
  #   living_room: { name: Lounge, icon: mdi:sofa, image: lounge.jpg, temperature_entity: sensor.lounge_temperature }

# Music page: radio stations, discover, albums, artists, podcasts and search from Music Assistant,
# played on its speakers. Appears automatically when the Music Assistant integration is installed.
# Everything except Radio also needs music_assistant_url and music_assistant_token in the add-on options.
music:
  # enabled: false
  # title: Music
  # tabs: [discover, radio, albums, artists, podcasts, party, search]
  # players: [media_player.kitchen, media_player.living_room]   # default: all Music Assistant players
  # default_player: media_player.living_room
  # fullscreen: false          # do not open the full-screen player when music starts

# Car page: start/stop charging, smart charging with its times, restart of the charger.
# The EV Smart Charging and Peblar entities are found automatically; set the rest here.
# The page only appears when something can be controlled.
ev:
  # enabled: false               # remove the menu entry
  # name: My car
  # image: car.jpg               # picture in the assets folder
  # battery_entity: sensor.my_car_battery
  # range_entity: sensor.my_car_range
  # plug_entity: sensor.my_car_plug_status

# The Climate page in the menu: a card per room with the temperature, the setpoint and a power button.
# It lists your climate helpers (Settings > Devices & services > Helpers), not every thermostat.
climate:
  # source: helpers          # helpers | all
  # entities: [climate.living_room, climate.office]   # or pick them yourself
  # exclude: [climate.bathroom]
  # title: Climate

# The Media page: continue watching and recently added movies and series from Plex, played on a
# Cast device or a Plex client. It appears when the Plex integration and such a player exist.
plex:
  # enabled: false           # remove the menu entry
  # players: [media_player.living_room_tv]   # default: every Plex client and Cast device
  # exclude: [media_player.kitchen_speaker]
  # transcode: auto         # stream links (Apple TV, DLNA): auto | always | never
  # title: Media

# The to-do lists page (Huskelister): every to-do list of Home Assistant, with items you can add, tick off, edit and delete.
# Lists of the Local To-do integration can also be created, renamed and deleted here.
todo:
  title: Huskelister
  # enabled: false
  # lists: [todo.shopping_list, todo.chores]   # default: every to-do list
  # exclude: [todo.old_list]

# The Devices page: robot vacuums, washing machines, dryers, dishwashers and clothes heaters.
# Vacuums and LG ThinQ appliances are found automatically; list anything else under appliances.
devices:
  # enabled: false
  # vacuums: [vacuum.robbie]                 # default: every vacuum
  # exclude: [vacuum.old_robot]
  # appliances:
  #   - { kind: dishwasher, name: Dishwasher, status_entity: sensor.dishwasher_status, remaining_entity: sensor.dishwasher_remaining, power_entity: switch.dishwasher }
  #   - { kind: heater, name: Clothes heater, power_entity: switch.clothes_rack }   # kind: washer | dryer | dishwasher | heater

# The Madplan page: a dinner plan for the week made with Home Assistant's AI Task (an AI integration such as
# OpenAI, Google or Ollama must be set up), recipes, a shopping list and calendar entries. Everything is
# optional; the page appears when Home Assistant has an AI Task entity, a to-do list or a calendar.
meals:
  # enabled: false
  # title: Madplan
  # shopping_list_entity: todo.shopping_list   # default: the Shopping list, or the first to-do list
  # calendar_entity: calendar.madplan         # a dinner event is written here (a Local Calendar is a good choice)
  # ai_task_entity: ai_task.openai            # default: the first AI Task entity
  # household: 4                              # people at the table
  # dinner_time: "18:00"
  # language: da                              # the language of dishes and recipes
  # auto: { weekday: sun, time: "17:00", days: 7 }   # plan the next week by itself

pages:
  - id: home
    title: Home
    icon: home
    tiles:
      - type: hero
        col: 1
        row: 1
        w: 2
        h: 2
        # image: living-room.jpg          # fallback background (file in the assets folder)
        # backgrounds:                    # first matching entry wins
        #   - when: { entity: light.living_room_lamp, state: "on" }
        #     image: living-room-on.jpg
        #   - when: { entity: sun.sun, state: below_horizon }
        #     image: living-room-night.jpg
        messages:                       # status messages on the front page (shown only while they apply)
          - { entity: sensor.waste_general }       # a pick-up sensor: "Empty the trash can" today and tomorrow
          - { entity: sensor.waste_paper }
          - { entity: sensor.waste_plastic }
          # A robot vacuum that needs its water changed also shows up here by itself (vacuum_water: false turns that off).
          # - { entity: sensor.waste_paper, within_days: 2, name: Paper, title: Put out the paper }
          # - { entity: binary_sensor.garage_door, text: The garage door is open, icon: garage-open }   # any entity that is on
        buttons:
          - { icon: weather-night, name: Good night, entity: input_boolean.good_night }   # toggles, lit while on
          - { icon: palm-tree, name: Vacation, entity: input_boolean.vacation }
          - { icon: lightbulb-group, name: All lights, entity: light.living_room_lamp }

      # Tonight's dinner from the Madplan page; tap it to open the recipe:
      # - { type: dinner, col: 3, row: 2 }

      - type: calendar                      # the next days with something planned, plus the forecast
        col: 3
        row: 1
        # entities: [calendar.family, calendar.work]   # default: every calendar
        # colors: ["#38bdf8", "#fb923c"]               # one colour per calendar, in the order above
        weather_entity: weather.forecast_home          # optional: daily temperature and icon
        days: 7                                        # how far ahead to look

      # The electricity price can also be a tile of its own:
      # - type: price
      #   col: 3
      #   row: 1
      #   name: Electricity
      #   entity: sensor.electricity_price      # needs a price list attribute, e.g. raw_today
      #   multiplier: 100                       # convert kr -> øre
      #   unit: øre
      #   decimals: 0

      - type: media                  # "now playing": follows whichever speaker plays, else shows the last track
        col: 4
        row: 1
        entities: music                # every Music Assistant speaker; or a list: [media_player.a, media_player.b]

      - type: vehicle
        col: 3
        row: 2
        name: Car
        icon: car-electric
        entity: sensor.car_range
        # image: car.png
        price:                                # optional: today's electricity price and 24h timeline at the bottom
          entity: sensor.electricity_price    # needs a price list attribute, e.g. raw_today
          multiplier: 100                     # convert kr -> øre
          unit: øre
          decimals: 0
        rows:
          - { icon: battery-charging, entity: sensor.car_battery, label_entity: sensor.car_charging_state }
          - { icon: gas-station, entity: sensor.car_fuel_level, label: fuel }

      - type: toggle
        col: 4
        row: 2
        name: All lights
        area: Indoor
        entity: light.living_room_lamp
        # image_on: lamp-on.png
        # image_off: lamp-off.png
